<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture overview with numbered order placement flow through the browser, Express routes, business modules, and JSON data store.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:13px}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#64748b}
      .section{font-size:12px;font-weight:700;letter-spacing:1px;fill:#64748b}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.band{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}
      .head{font-size:16px;font-weight:700}.small{font-size:12px;fill:#475569}.tiny{font-size:11px;fill:#64748b}
      .ticket{fill:#fff7ed;stroke:#f97316;stroke-width:2}.ticketText{fill:#9a3412}
      .step{fill:#2563eb}.stepN{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
      .line{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#flowArrow)}
      .flabel{font-size:11px;fill:#1d4ed8;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="36" y="42" class="title">ShopLedger · application architecture</text>
  <text x="36" y="66" class="subtitle">Express application · browser POS · JSON-backed shop data</text>

  <!-- Browser UI -->
  <rect x="30" y="100" width="245" height="620" rx="12" class="band"/>
  <text x="48" y="128" class="section">BROWSER UI</text>
  <rect x="48" y="147" width="209" height="98" rx="8" class="box"/>
  <text x="64" y="173" class="head">public/</text>
  <text x="64" y="195" class="small">index.html</text>
  <text x="64" y="215" class="small">js/app.js · post(url, data, cb)</text>
  <text x="64" y="233" class="small">get(url, cb) · POS cart</text>
  <rect x="48" y="269" width="209" height="47" rx="7" class="box"/>
  <text x="64" y="290" class="small">css/</text><text x="64" y="307" class="tiny">static stylesheets</text>
  <text x="48" y="354" class="section">ORDER REQUEST</text>
  <rect x="48" y="369" width="209" height="61" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="69" cy="390" r="12" class="step"/><text x="69" y="394" class="stepN">1</text>
  <text x="89" y="392" class="small">POST /api/orders</text>
  <text x="64" y="414" class="tiny">cart items + coupon + payment</text>
  <text x="48" y="474" class="section">ORDER RESPONSE</text>
  <rect x="48" y="488" width="209" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="69" cy="509" r="12" class="step"/><text x="69" y="513" class="stepN">7</text>
  <text x="89" y="512" class="small">201 + order JSON</text>
  <text x="64" y="532" class="tiny">UI refreshes order list / cart</text>

  <!-- Server and route layer -->
  <rect x="300" y="100" width="420" height="620" rx="12" class="band"/>
  <text x="320" y="128" class="section">HTTP SERVER &amp; ROUTES</text>
  <rect x="320" y="147" width="380" height="74" rx="8" class="box"/>
  <text x="338" y="173" class="head">server.js</text>
  <text x="338" y="195" class="small">Express · static public/ · JSON body parser</text>
  <text x="338" y="213" class="small">mounts route modules at /api</text>
  <line x1="510" y1="221" x2="510" y2="240" class="line"/>
  <rect x="320" y="242" width="380" height="48" rx="7" class="box"/>
  <text x="338" y="263" class="small" font-weight="700">routes/products.js</text><text x="338" y="281" class="tiny">GET /products · GET /coupons</text>
  <rect x="320" y="300" width="380" height="82" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <circle cx="342" cy="322" r="12" class="step"/><text x="342" y="326" class="stepN">2</text>
  <text x="362" y="325" class="head">routes/orders.js</text>
  <text x="338" y="349" class="small">POST /orders · validate items, stock &amp; coupon</text>
  <text x="338" y="369" class="tiny">GET /orders · GET /orders/:id · POST /orders/:id/cancel</text>
  <rect x="320" y="392" width="380" height="48" rx="7" class="box"/>
  <text x="338" y="413" class="small" font-weight="700">routes/customers.js</text><text x="338" y="431" class="tiny">GET /customers · POST /customers/:id/settle</text>
  <rect x="320" y="450" width="380" height="55" rx="7" class="box"/>
  <text x="338" y="472" class="small" font-weight="700">routes/reports.js</text><text x="338" y="492" class="tiny">dashboard · GST reconciliation · pricing preview · export</text>
  <rect x="320" y="530" width="380" height="84" rx="8" class="ticket"/>
  <circle cx="342" cy="552" r="12" class="step"/><text x="342" y="556" class="stepN">6</text>
  <text x="362" y="555" class="head ticketText">lib/store.js</text>
  <text x="338" y="579" class="small ticketText">appendAudit(db, …) · write(db)</text>
  <text x="338" y="600" class="tiny ticketText">read() · ensureStructure(db)</text>
  <rect x="320" y="639" width="380" height="54" rx="7" class="box"/>
  <text x="338" y="662" class="small" font-weight="700">/orders/:id/invoice</text>
  <text x="338" y="681" class="tiny">server.js → invoice.render(order)</text>

  <!-- Library modules -->
  <rect x="745" y="100" width="300" height="620" rx="12" class="band"/>
  <text x="765" y="128" class="section">BUSINESS MODULES · lib/</text>
  <rect x="765" y="147" width="260" height="63" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="787" cy="168" r="12" class="step"/><text x="787" y="172" class="stepN">3</text>
  <text x="807" y="172" class="head">inventory.js</text>
  <text x="783" y="197" class="small">find() · check() · reserve()</text>
  <rect x="765" y="222" width="260" height="63" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="787" cy="243" r="12" class="step"/><text x="787" y="247" class="stepN">4</text>
  <text x="807" y="247" class="head">pricing.js</text>
  <text x="783" y="272" class="small">subtotal() · computeTotals()</text>
  <rect x="765" y="297" width="260" height="53" rx="8" class="box"/>
  <text x="783" y="320" class="small" font-weight="700">coupons.js</text><text x="783" y="339" class="tiny">normalizeCode() · validate()</text>
  <rect x="765" y="362" width="260" height="53" rx="8" class="box"/>
  <text x="783" y="385" class="small" font-weight="700">tax.js</text><text x="783" y="404" class="tiny">getRateForItem() · splitCgstSgst()</text>
  <rect x="765" y="427" width="260" height="67" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="787" cy="448" r="12" class="step"/><text x="787" y="452" class="stepN">5</text>
  <text x="807" y="452" class="head">orders.js</text>
  <text x="783" y="478" class="small">add(db, orderData)</text>
  <rect x="765" y="506" width="260" height="62" rx="8" class="box"/>
  <text x="783" y="529" class="small" font-weight="700">ledger.js</text><text x="783" y="550" class="tiny">findCustomer() · chargeOrderToKhata()</text>
  <rect x="765" y="580" width="260" height="50" rx="8" class="box"/>
  <text x="783" y="602" class="small" font-weight="700">dates.js</text><text x="783" y="620" class="tiny">today() · normalizeDateKey()</text>
  <rect x="765" y="642" width="260" height="51" rx="8" class="ticket"/>
  <text x="783" y="664" class="small ticketText" font-weight="700">invoice.js</text><text x="783" y="684" class="tiny ticketText">computeInvoiceFigures() · render()</text>

  <!-- Config and persistence -->
  <rect x="1070" y="100" width="105" height="173" rx="12" class="band"/>
  <text x="1087" y="128" class="section">SETTINGS</text>
  <rect x="1085" y="147" width="75" height="84" rx="8" class="box"/>
  <text x="1094" y="174" class="small" font-weight="700">config.js</text>
  <text x="1094" y="195" class="tiny">port · shop</text><text x="1094" y="213" class="tiny">tax · coupons</text>
  <rect x="1070" y="300" width="105" height="205" rx="12" class="band"/>
  <text x="1087" y="328" class="section">DATA</text>
  <rect x="1085" y="348" width="75" height="105" rx="8" class="box"/>
  <text x="1094" y="375" class="small" font-weight="700">data/</text><text x="1094" y="398" class="small">db.json</text>
  <text x="1094" y="421" class="tiny">products</text><text x="1094" y="438" class="tiny">orders · customers</text>
  <text x="1075" y="478" class="tiny">read / write</text>

  <!-- Numbered order flow -->
  <path d="M257 399 H310" class="flow"/><text x="272" y="389" class="flabel">1</text>
  <path d="M700 339 H755" class="flow"/><text x="721" y="329" class="flabel">2</text>
  <path d="M895 210 V218" class="flow"/><text x="906" y="218" class="flabel">3</text>
  <path d="M895 285 V293" class="flow"/><text x="906" y="293" class="flabel">4</text>
  <path d="M895 415 V423" class="flow"/><text x="906" y="423" class="flabel">5</text>
  <path d="M765 460 H710 V572 H700" class="flow"/><text x="720" y="553" class="flabel">6</text>
  <path d="M320 572 H287 V517 H257" class="flow"/><text x="291" y="507" class="flabel">7</text>
  <path d="M1025 599 H1060 V400 H1075" class="line"/>
  <path d="M1025 170 H1075" class="line"/>
  <path d="M700 198 H730 V606 H755" class="line"/>

  <!-- Legend -->
  <rect x="30" y="741" width="1145" height="40" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="48" y="766" class="small" font-weight="700">Legend</text>
  <rect x="110" y="752" width="22" height="17" rx="3" class="ticket"/><text x="141" y="766" class="small">Ticket module: lib/invoice.js</text>
  <circle cx="365" cy="760" r="10" class="step"/><text x="365" y="764" class="stepN">#</text><text x="383" y="766" class="small">Order placement sequence</text>
  <line x1="596" y1="760" x2="642" y2="760" class="line"/><text x="653" y="766" class="small">Module / data dependency</text>
  <line x1="866" y1="760" x2="912" y2="760" class="flow"/><text x="923" y="766" class="small">Numbered order flow</text>
</svg>
